        <!--título-->
        <h1>Preencha os campos abaixo</h1>
        <hr>

        <form>
			Nome:<input type="text" name="nome" required placeholder="Digite o seu nome" pattern="[a-z A-Z\s]+$" minlenght="3" maxlenght="50" class="texto"><br>
			E-MAIL: <input type="text" name="email" required placeholder="exemplodeemail1@email.com" class="texto"><br>
			Sua avaliação: <select name="avalia" class="texto" required><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><br>
			Comentários: <br>
			<textarea cols="60" rows="8" placeholder="Deixe aqui o seu comentário" class="texto"></textarea><br><br>
			<input type="submit" value="Enviar" class="botao">
			<input type="reset" value="Limpar" class="botao">
		</form>
